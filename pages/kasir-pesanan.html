<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kasir Pesanan | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Kasir • Pesanan</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="kasir-pesanan.html">Pesanan</a>
        <a class="nav__link" href="kasir-pembayaran.html">Pembayaran</a>
        <a class="nav__link" href="kasir-struk.html">Struk</a>
        <a class="nav__link" href="admin-dashboard.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Daftar Pesanan (Mock)</h1>

    <div class="card">
      <div class="muted" style="font-size:13px">
        Kasir akan memproses pesanan yang statusnya <b>Selesai</b>.
        Gunakan halaman Admin untuk mengubah status pesanan.
      </div>
      <div class="divider"></div>
      <div id="list" style="display:grid; gap:12px"></div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    function render(){
      const orders = MIC.getOrders();
      const selesai = orders.filter(o => o.status === 'Selesai');
      const list = document.getElementById('list');
      if (!selesai.length) {
        list.innerHTML = `<div class="muted">Tidak ada pesanan yang siap bayar.</div>`;
        return;
      }

      list.innerHTML = selesai
        .sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal))
        .map(o => `
          <div class="product" style="grid-template-columns: 1fr;">
            <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start">
              <div>
                <div style="font-weight:900">Meja ${o.nomor_meja}</div>
                <div class="muted" style="font-size:13px">ID ${o.id_pesanan} • ${new Date(o.tanggal).toLocaleString('id-ID')}</div>
                <div class="muted" style="margin-top:6px">Total: <b>${MIC.fmtIDR(o.total)}</b></div>
              </div>
              <div style="display:flex; gap:10px; flex-wrap:wrap">
                <button class="btn btn--primary" type="button" data-select="${o.id_pesanan}">Konfirmasi Bayar</button>
              </div>
            </div>
          </div>
        `)
        .join('');

      list.querySelectorAll('[data-select]').forEach(btn => {
        btn.addEventListener('click', () => {
          const orderId = btn.getAttribute('data-select');
          sessionStorage.setItem('mic_last_cashier_order_id', String(orderId));
          window.location.href = 'kasir-pembayaran.html';
        });
      });
    }

    render();
    setInterval(render, 2500);
  </script>
</body>
</html>
