<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status Pesanan | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Status Pesanan</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="menu.html">Menu</a>
        <a class="nav__link" href="keranjang.html">Keranjang</a>
        <a class="nav__link" href="checkout.html">Checkout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Pantau Pesanan</h1>

    <div class="card">
      <div class="grid-2" style="align-items:start">
        <div>
          <div class="muted" style="font-size:13px" id="orderMeta">Memuat...</div>

          <div class="divider"></div>

          <div style="display:grid; gap:12px">
            <div class="kv">
              <div>
                <div style="font-weight:900">Menunggu</div>
                <div class="muted">Admin menerima pesanan</div>
              </div>
              <span class="badge" id="b_waiting">—</span>
            </div>

            <div class="kv">
              <div>
                <div style="font-weight:900">Diproses</div>
                <div class="muted">Pengurus menyiapkan pesanan</div>
              </div>
              <span class="badge" id="b_processing">—</span>
            </div>

            <div class="kv">
              <div>
                <div style="font-weight:900">Selesai</div>
                <div class="muted">Pesanan siap diambil</div>
              </div>
              <span class="badge" id="b_done">—</span>
            </div>

            <div class="kv">
              <div>
                <div style="font-weight:900">Sudah dibayar</div>
                <div class="muted">Kasir mengonfirmasi pembayaran</div>
              </div>
              <span class="badge" id="b_paid">—</span>
            </div>
          </div>

          <div class="divider"></div>

          <div class="row" style="gap:10px; flex-wrap:wrap">
            <button id="btnRefresh" class="btn" type="button">Refresh Status</button>
            <button id="btnNewOrder" class="btn btn--primary" type="button">Order Lagi</button>
          </div>
        </div>

        <div>
          <h2 class="card__title" style="margin-top:0">Rincian Pesanan</h2>
          <div id="orderDetails" class="muted">—</div>
          <div class="divider"></div>
          <div class="muted" style="font-size:13px">Total</div>
          <div style="font-weight:900; font-size:26px" id="total">Rp 0</div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const orderMeta = document.getElementById('orderMeta');
    const orderDetails = document.getElementById('orderDetails');
    const total = document.getElementById('total');

    const b_waiting = document.getElementById('b_waiting');
    const b_processing = document.getElementById('b_processing');
    const b_done = document.getElementById('b_done');
    const b_paid = document.getElementById('b_paid');

    function badgeFor(status, key) {
      // key: waiting/processing/done/paid
      const paid = status === 'Sudah dibayar';
      const done = status === 'Selesai' || status === 'Sudah dibayar';
      const processing = status === 'Diproses' || done || paid;
      const waiting = status === 'Menunggu' || processing || done || paid;

      const map = { waiting, processing, done, paid };
      const ok = map[key];
      return ok ? '✓' : '—';
    }

    function render() {
      const lastId = sessionStorage.getItem('mic_last_order_id');
      if (!lastId) {
        orderMeta.textContent = 'Belum ada pesanan. Silakan checkout terlebih dahulu.';
        orderDetails.textContent = '—';
        total.textContent = MIC.fmtIDR(0);
        [b_waiting,b_processing,b_done,b_paid].forEach(b=>b.textContent='—');
        return;
      }

      const order = MIC.getOrderById(lastId);
      if (!order) {
        orderMeta.textContent = 'Pesanan tidak ditemukan (mungkin sudah direset).';
        orderDetails.textContent = '—';
        total.textContent = MIC.fmtIDR(0);
        [b_waiting,b_processing,b_done,b_paid].forEach(b=>b.textContent='—');
        return;
      }

      orderMeta.textContent = `Meja ${order.nomor_meja} • ID Pesanan: ${order.id_pesanan} • Status: ${order.status}`;
      total.textContent = MIC.fmtIDR(order.total);

      orderDetails.innerHTML = (order.details || []).map(d => {
        const menu = MIC.getMenuById(d.id_menu);
        return `<div class="kv" style="padding:10px 0; grid-template-columns: 1fr auto">
          <div>
            <div style="font-weight:900">${menu?.nama_menu || 'Menu'}</div>
            <div class="muted" style="font-size:13px">Jumlah: ${d.jumlah} • Subtotal: ${MIC.fmtIDR(d.subtotal)}</div>
          </div>
          <div class="muted" style="font-weight:800">x${d.jumlah}</div>
        </div>`;
      }).join('');

      b_waiting.textContent = badgeFor(order.status, 'waiting');
      b_processing.textContent = badgeFor(order.status, 'processing');
      b_done.textContent = badgeFor(order.status, 'done');
      b_paid.textContent = badgeFor(order.status, 'paid');
    }

    document.getElementById('btnRefresh').addEventListener('click', render);
    document.getElementById('btnNewOrder').addEventListener('click', () => {
      window.location.href = 'menu.html';
    });

    render();
  </script>
</body>
</html>
