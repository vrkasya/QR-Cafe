<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keranjang | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Keranjang Pesanan</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="menu.html">Menu</a>
        <a class="nav__link" href="checkout.html">Checkout</a>
        <a class="nav__link" href="status-pesanan.html">Status</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Keranjang</h1>

    <div class="card">
      <div id="tableHint" class="muted" style="margin-bottom:10px"></div>
      <div id="cartEmpty" class="muted" style="display:none">Keranjang kosong. Kembali ke menu untuk menambahkan pesanan.</div>

      <div id="cartList" class="cart-list" style="display:none"></div>

      <div class="divider" style="margin-top:16px"></div>

      <div class="form-row" style="align-items:center; justify-content:space-between">
        <div>
          <div class="muted" style="font-size:13px">Subtotal</div>
          <div style="font-weight:900; font-size:20px" id="cartTotal">Rp 0</div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end">
          <button id="btnBackMenu" class="btn" type="button">Tambah Lagi</button>
          <button id="btnCheckout" class="btn btn--primary" type="button">Checkout</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const tableHint = document.getElementById('tableHint');
    const cartEmpty = document.getElementById('cartEmpty');
    const cartList = document.getElementById('cartList');
    const cartTotal = document.getElementById('cartTotal');

    const ensureTable = () => {
      const table = MIC.getSelectedTable();
      if (!table) {
        alert('Pilih meja dulu di Scan QR.');
        window.location.href = 'scan.html';
        return null;
      }
      tableHint.textContent = `Meja ${table.nomor_meja} • QR: ${table.qr_code}`;
      return table;
    };

    const fmt = (n) => MIC.fmtIDR(n);

    const renderCart = () => {
      const { items, total } = MIC.cartWithComputedTotals();
      cartTotal.textContent = fmt(total);

      if (!items.length) {
        cartEmpty.style.display = 'block';
        cartList.style.display = 'none';
        cartList.innerHTML = '';
        return;
      }

      cartEmpty.style.display = 'none';
      cartList.style.display = 'block';

      cartList.innerHTML = items.map(it => {
        return `
          <div class="product" style="grid-template-columns:72px 1fr;">
            <div class="product__img" style="width:72px;height:64px">${it.gambar ? '' : '🍽️'}</div>
            <div>
              <div style="display:flex; justify-content:space-between; gap:10px">
                <div>
                  <div class="product__name">${it.nama_menu}</div>
                  <div class="product__meta">${fmt(it.harga)} • Subtotal: ${fmt(it.subtotal)}</div>
                </div>
                <div>
                  <button class="btn" type="button" data-remove="${it.id_menu}">Hapus</button>
                </div>
              </div>

              <div style="display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap">
                <label style="min-width:90px">Jumlah</label>
                <div style="display:flex; gap:8px; align-items:center">
                  <button class="btn" type="button" data-dec="${it.id_menu}">-</button>
                  <input class="input" style="width:92px" type="number" min="1" step="1" value="${it.jumlah}" data-qty="${it.id_menu}" />
                  <button class="btn" type="button" data-inc="${it.id_menu}">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      cartList.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-remove');
          MIC.removeFromCart(id);
          renderCart();
        });
      });

      cartList.querySelectorAll('[data-dec]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-dec');
          const cart = JSON.parse(localStorage.getItem('mic_cart_v1') || '{"items":[]}');
          const item = (cart.items || []).find(i => String(i.id_menu) === String(id));
          const current = Number(item?.jumlah || 1);
          MIC.setCartQty(id, current - 1);
          renderCart();
        });
      });

      cartList.querySelectorAll('[data-inc]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-inc');
          const cart = JSON.parse(localStorage.getItem('mic_cart_v1') || '{"items":[]}');
          const item = (cart.items || []).find(i => String(i.id_menu) === String(id));
          const current = Number(item?.jumlah || 0);
          MIC.setCartQty(id, current + 1);
          renderCart();
        });
      });

      cartList.querySelectorAll('[data-qty]').forEach(inp => {
        inp.addEventListener('change', () => {
          const id = inp.getAttribute('data-qty');
          const q = Number(inp.value);
          MIC.setCartQty(id, q);
          renderCart();
        });
      });
    };

    document.getElementById('btnBackMenu').addEventListener('click', () => {
      window.location.href = 'menu.html';
    });

    document.getElementById('btnCheckout').addEventListener('click', () => {
      const { items } = MIC.cartWithComputedTotals();
      if (!items.length) {
        alert('Keranjang kosong');
        return;
      }
      window.location.href = 'checkout.html';
    });

    ensureTable();
    renderCart();
  </script>
</body>
</html>
