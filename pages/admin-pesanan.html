<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Pesanan | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Admin • Pesanan</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="admin-dashboard.html">Dashboard</a>
        <a class="nav__link" href="admin-menu.html">Menu</a>
        <a class="nav__link" href="admin-kategori.html">Kategori</a>
        <a class="nav__link" href="admin-meja.html">Meja</a>
        <a class="nav__link" href="admin-laporan.html">Laporan</a>
        <a class="nav__link" href="admin-login.html" id="btnLogout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Manajemen Pesanan (Demo)</h1>

    <div class="card">
      <div class="form-row" style="align-items:flex-end">
        <div style="flex:1">
          <label>Pilih Pesanan</label>
          <select id="orderSelect" class="input"></select>
        </div>
        <div style="flex:1">
          <label>Ubah Status</label>
          <select id="statusSelect" class="input">
            <option value="Menunggu">Menunggu</option>
            <option value="Diproses">Diproses</option>
            <option value="Selesai">Selesai</option>
            <option value="Sudah dibayar">Sudah dibayar</option>
          </select>
        </div>
        <div style="display:flex; gap:12px; flex-wrap:wrap">
          <button id="btnSaveStatus" class="btn btn--primary" type="button">Simpan</button>
          <button id="btnRefresh" class="btn" type="button">Refresh</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="grid-2" style="align-items:start">
        <div>
          <h2 class="card__title" style="margin-top:0">Detail Pesanan</h2>
          <div id="orderDetail" class="muted">—</div>
        </div>
        <div>
          <h2 class="card__title" style="margin-top:0">Item</h2>
          <div id="detailsList" style="display:grid; gap:12px"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const isLoggedIn = () => localStorage.getItem('mic_admin_logged_in_v1') === '1';
    if (!isLoggedIn()) window.location.href = 'admin-login.html';

    document.getElementById('btnLogout').addEventListener('click', (e)=>{
      e.preventDefault();
      localStorage.setItem('mic_admin_logged_in_v1','0');
      window.location.href = 'admin-login.html';
    });

    const orderSelect = document.getElementById('orderSelect');
    const statusSelect = document.getElementById('statusSelect');

    function getOrdersSorted(){
      return [...MIC.getOrders()].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
    }

    function renderOrders(){
      const orders = getOrdersSorted();
      orderSelect.innerHTML = '';
      if (!orders.length) {
        orderSelect.innerHTML = '<option value="">Belum ada pesanan</option>';
        return null;
      }
      orders.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.id_pesanan;
        opt.textContent = `#${o.id_pesanan} • Meja ${o.nomor_meja} • ${o.status}`;
        orderSelect.appendChild(opt);
      });

      const url = new URL(window.location.href);
      const pid = url.searchParams.get('orderId');
      if (pid) orderSelect.value = String(pid);
      return orders.find(o => String(o.id_pesanan) === String(orderSelect.value)) || orders[0];
    }

    function renderOrder(order){
      const detailsList = document.getElementById('detailsList');
      const orderDetail = document.getElementById('orderDetail');
      if (!order) {
        orderDetail.textContent = '—';
        detailsList.innerHTML = '';
        return;
      }

      orderDetail.innerHTML = `
        <div><b>Meja</b>: ${order.nomor_meja}</div>
        <div><b>ID Pesanan</b>: ${order.id_pesanan}</div>
        <div><b>Tanggal</b>: ${new Date(order.tanggal).toLocaleString('id-ID')}</div>
        <div><b>Status</b>: ${order.status}</div>
        <div><b>Total</b>: ${MIC.fmtIDR(order.total)}</div>
      `;

      detailsList.innerHTML = (order.details || []).map(d => `
        <div class="kv">
          <div>
            <div style="font-weight:900">${d.nama_menu || MIC.getMenuById(d.id_menu)?.nama_menu || 'Menu'}</div>
            <div class="muted" style="font-size:13px">Jumlah: ${d.jumlah}</div>
          </div>
          <div style="font-weight:900">${MIC.fmtIDR(d.subtotal)}</div>
        </div>
      `).join('');

      statusSelect.value = order.status;
    }

    function refresh(){
      const order = renderOrders();
      if (order) renderOrder(order);
    }

    orderSelect.addEventListener('change', () => {
      const order = MIC.getOrderById(orderSelect.value);
      renderOrder(order);
    });

    document.getElementById('btnSaveStatus').addEventListener('click', () => {
      if (!orderSelect.value) return;
      const orderId = orderSelect.value;
      const newStatus = statusSelect.value;
      MIC.updateOrderStatus(orderId, newStatus);
      refresh();
    });

    document.getElementById('btnRefresh').addEventListener('click', refresh);

    // initial
    refresh();
  </script>
</body>
</html>
