<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Admin Dashboard</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="admin-menu.html">Menu</a>
        <a class="nav__link" href="admin-kategori.html">Kategori</a>
        <a class="nav__link" href="admin-meja.html">Meja</a>
        <a class="nav__link" href="admin-pesanan.html">Pesanan</a>
        <a class="nav__link" href="admin-laporan.html">Laporan</a>
        <a class="nav__link" href="admin-login.html" id="btnLogout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Dashboard</h1>

    <div class="grid-3">
      <div class="card">
        <div class="muted" style="font-size:13px">Jumlah Pesanan</div>
        <div style="font-weight:900; font-size:28px" id="statOrder">0</div>
      </div>
      <div class="card">
        <div class="muted" style="font-size:13px">Pendapatan (Mock)</div>
        <div style="font-weight:900; font-size:28px" id="statRevenue">Rp 0</div>
      </div>
      <div class="card">
        <div class="muted" style="font-size:13px">Status Pesanan</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px" id="statStatus"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 class="card__title" style="margin-top:0">Pesanan Masuk (Terbaru)</h2>
      <div class="divider"></div>
      <div id="ordersList" style="display:grid; gap:12px"></div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const isLoggedIn = () => localStorage.getItem('mic_admin_logged_in_v1') === '1';

    if (!isLoggedIn()) {
      window.location.href = 'admin-login.html';
    }

    document.getElementById('btnLogout').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.setItem('mic_admin_logged_in_v1', '0');
      window.location.href = 'admin-login.html';
    });

    function badge(status) {
      const map = {
        'Menunggu': 'badge--warning',
        'Diproses': 'badge--success',
        'Selesai': 'badge--success',
        'Sudah dibayar': 'badge--success'
      };
      const cls = map[status] || '';
      return `<span class="badge ${cls}">${status}</span>`;
    }

    function computeRevenue(orders) {
      return orders
        .filter(o => o.status === 'Sudah dibayar')
        .reduce((sum, o) => sum + Number(o.total || 0), 0);
    }

    function render() {
      const orders = MIC.getOrders();

      document.getElementById('statOrder').textContent = String(orders.length);
      document.getElementById('statRevenue').textContent = MIC.fmtIDR(computeRevenue(orders));

      const statuses = ['Menunggu','Diproses','Selesai','Sudah dibayar'];
      const container = document.getElementById('statStatus');
      container.innerHTML = statuses.map(s => {
        const count = orders.filter(o => o.status === s).length;
        const cls = s === 'Menunggu' ? 'badge--warning' : 'badge--success';
        return `<span class="badge ${cls}">${s}: ${count}</span>`;
      }).join('');

      const latest = [...orders].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal)).slice(0, 8);
      document.getElementById('ordersList').innerHTML = latest.length
        ? latest.map(o => {
            const detailsCount = (o.details || []).reduce((sum, d) => sum + Number(d.jumlah||0), 0);
            return `
              <div class="product" style="grid-template-columns: 1fr;">
                <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap">
                  <div>
                    <div style="font-weight:900">Meja ${o.nomor_meja}</div>
                    <div class="muted" style="font-size:13px">ID ${o.id_pesanan} • ${new Date(o.tanggal).toLocaleString('id-ID')}</div>
                    <div class="muted" style="margin-top:6px">Item total: ${detailsCount}</div>
                  </div>
                  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
                    ${badge(o.status)}
                    <a class="btn" href="admin-pesanan.html?orderId=${encodeURIComponent(o.id_pesanan)}">Ubah Status</a>
                  </div>
                </div>
              </div>
            `;
          }).join('')
        : `<div class="muted">Belum ada pesanan.</div>`;
    }

    render();
    setInterval(render, 2500);
  </script>
</body>
</html>
