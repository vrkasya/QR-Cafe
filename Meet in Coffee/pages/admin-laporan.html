<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Laporan | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Admin • Laporan</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="admin-dashboard.html">Dashboard</a>
        <a class="nav__link" href="admin-menu.html">Menu</a>
        <a class="nav__link" href="admin-kategori.html">Kategori</a>
        <a class="nav__link" href="admin-meja.html">Meja</a>
        <a class="nav__link" href="admin-pesanan.html">Pesanan</a>
        <a class="nav__link" href="admin-login.html" id="btnLogout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Laporan Penjualan (Mock)</h1>

    <div class="grid-3">
      <div class="card">
        <div class="muted" style="font-size:13px">Total Penjualan (Sudah Dibayar)</div>
        <div style="font-weight:900; font-size:28px" id="totalRevenue">Rp 0</div>
      </div>
      <div class="card">
        <div class="muted" style="font-size:13px">Jumlah Transaksi</div>
        <div style="font-weight:900; font-size:28px" id="txCount">0</div>
      </div>
      <div class="card">
        <div class="muted" style="font-size:13px">Menu Terlaris (Top 1)</div>
        <div style="font-weight:900; font-size:18px" id="topItem">—</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 class="card__title" style="margin-top:0">Riwayat Transaksi</h2>
      <div class="divider"></div>
      <div style="overflow:auto; max-height:420px">
        <table class="table">
          <thead>
            <tr>
              <th>ID Pesanan</th>
              <th>Meja</th>
              <th>Tanggal</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const isLoggedIn = () => localStorage.getItem('mic_admin_logged_in_v1') === '1';
    if (!isLoggedIn()) window.location.href = 'admin-login.html';

    document.getElementById('btnLogout').addEventListener('click', (e)=>{
      e.preventDefault();
      localStorage.setItem('mic_admin_logged_in_v1','0');
      window.location.href = 'admin-login.html';
    });

    function render(){
      const orders = MIC.getOrders();
      const paid = orders.filter(o => o.status === 'Sudah dibayar');

      const totalRevenue = paid.reduce((s,o)=> s + Number(o.total||0), 0);
      document.getElementById('totalRevenue').textContent = MIC.fmtIDR(totalRevenue);
      document.getElementById('txCount').textContent = String(paid.length);

      // Top item by quantity
      const qtyByMenu = new Map();
      paid.forEach(o => {
        (o.details||[]).forEach(d => {
          const key = String(d.id_menu);
          const prev = qtyByMenu.get(key) || 0;
          qtyByMenu.set(key, prev + Number(d.jumlah||0));
        });
      });
      let top = null;
      for (const [menuId, qty] of qtyByMenu.entries()) {
        if (!top || qty > top.qty) top = { menuId, qty };
      }
      if (top) {
        const menu = MIC.getMenuById(top.menuId);
        document.getElementById('topItem').textContent = `${menu?.nama_menu || 'Menu'} (${top.qty} pcs)`;
      } else {
        document.getElementById('topItem').textContent = '—';
      }

      const tbody = document.getElementById('tbody');
      const allSorted = [...orders].sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
      tbody.innerHTML = allSorted.map(o => `
        <tr>
          <td>${o.id_pesanan}</td>
          <td>${o.nomor_meja}</td>
          <td>${new Date(o.tanggal).toLocaleString('id-ID')}</td>
          <td>${o.status}</td>
          <td>${MIC.fmtIDR(o.total)}</td>
        </tr>
      `).join('');
    }

    render();
    setInterval(render, 3000);
  </script>
</body>
</html>
