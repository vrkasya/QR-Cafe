<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Struk | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Struk</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="kasir-pesanan.html">Pesanan</a>
        <a class="nav__link" href="kasir-pembayaran.html">Pembayaran</a>
        <a class="nav__link" href="kasir-struk.html" id="btnPrint">Print</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Cetak Struk (Mock)</h1>

    <div class="card">
      <div class="row" style="gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap" >
        <div class="muted" style="font-size:13px">Gunakan tombol Print untuk mencetak (menggunakan CSS @media print).</div>
        <button class="btn btn--primary no-print" type="button" id="btnPrint2">Print Struk</button>
      </div>
      <div class="divider"></div>

      <div id="receipt" class="receipt" style="max-width:520px; margin:0 auto">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const receipt = document.getElementById('receipt');
    const orderId = sessionStorage.getItem('mic_last_cashier_order_id');

    function render(){
      if (!orderId) {
        receipt.innerHTML = `<div class="muted">Tidak ada pesanan terpilih.</div>`;
        return;
      }
      const order = MIC.getOrderById(orderId);
      if (!order) {
        receipt.innerHTML = `<div class="muted">Pesanan tidak ditemukan.</div>`;
        return;
      }

      const itemsHtml = (order.details||[]).map(d => `
        <div style="display:flex; justify-content:space-between; gap:12px">
          <div>
            <div style="font-weight:800">${MIC.getMenuById(d.id_menu)?.nama_menu || 'Menu'}</div>
            <div class="muted" style="font-size:12px">Jumlah: ${d.jumlah}</div>
          </div>
          <div style="font-weight:800">${MIC.fmtIDR(d.subtotal)}</div>
        </div>
      `).join('');

      receipt.innerHTML = `
        <div style="text-align:center; margin-bottom:14px">
          <div style="font-weight:900; font-size:18px">MEET IN COFFEE</div>
          <div class="muted" style="font-size:12px; margin-top:4px">Struk Pembayaran</div>
          <div class="muted" style="font-size:12px; margin-top:2px">${new Date(order.tanggal).toLocaleString('id-ID')}</div>
        </div>

        <div class="kv" style="border-bottom:1px solid rgba(0,0,0,.08)">
          <div>
            <div class="muted" style="font-size:12px">Meja</div>
            <div style="font-weight:900">${order.nomor_meja}</div>
          </div>
          <div style="text-align:right">
            <div class="muted" style="font-size:12px">ID Pesanan</div>
            <div style="font-weight:900">#${order.id_pesanan}</div>
          </div>
        </div>

        <div style="margin-top:12px; display:grid; gap:10px">${itemsHtml}</div>

        <div class="divider"></div>

        <div style="display:flex; justify-content:space-between; gap:12px; align-items:flex-end">
          <div>
            <div class="muted" style="font-size:12px">Total</div>
            <div class="muted" style="font-size:12px; margin-top:2px">(Sudah dibayar)</div>
          </div>
          <div style="font-weight:900; font-size:22px">${MIC.fmtIDR(order.total)}</div>
        </div>

        <div class="muted" style="font-size:12px; margin-top:14px; text-align:center">
          Terima kasih telah memesan.
        </div>
      `;
    }

    document.getElementById('btnPrint2').addEventListener('click', () => window.print());

    render();
  </script>

  <style>
    .receipt{padding:14px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.10); border-radius:14px}
    @media print{
      .receipt{border:1px solid #ddd; background:white}
    }
  </style>
</body>
</html>
