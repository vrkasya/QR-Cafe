<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Admin</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="../index.html">Home</a>
        <a class="nav__link" href="scan.html">Pelanggan</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Login Admin (Demo)</h1>

    <div class="card" style="max-width:520px; margin:0 auto">
      <div class="muted" style="margin-bottom:12px; font-size:13px">
        Front-end ini menggunakan autentikasi demo. Backend PHP + MySQL nanti akan menggantikan.
      </div>

      <label>Username</label>
      <input id="username" class="input" placeholder="admin" />

      <div style="height:10px"></div>

      <label>Password</label>
      <input id="password" class="input" type="password" placeholder="admin" />

      <div class="divider"></div>

      <div class="row" style="gap:12px; flex-wrap:wrap">
        <button id="btnLogin" class="btn btn--primary" type="button">Masuk</button>
        <button id="btnReset" class="btn" type="button">Reset Demo</button>
      </div>

      <div class="muted" id="msg" style="margin-top:12px; font-size:13px"></div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const btnLogin = document.getElementById('btnLogin');
    const btnReset = document.getElementById('btnReset');

    function setLoggedIn(val){
      localStorage.setItem('mic_admin_logged_in_v1', val ? '1' : '0');
    }
    function isLoggedIn(){
      return localStorage.getItem('mic_admin_logged_in_v1') === '1';
    }

    btnLogin.addEventListener('click', () => {
      const u = (document.getElementById('username').value || '').trim();
      const p = (document.getElementById('password').value || '').trim();

      // Demo credentials
      if (u.toLowerCase() === 'admin' && p.toLowerCase() === 'admin') {
        setLoggedIn(true);
        msg.textContent = 'Login berhasil.';
        window.location.href = 'admin-dashboard.html';
      } else {
        msg.textContent = 'Login gagal. Gunakan username: admin, password: admin (demo).';
      }
    });

    btnReset.addEventListener('click', () => {
      if (!confirm('Reset seluruh data demo?')) return;
      MIC.resetDemoData();
      setLoggedIn(false);
      msg.textContent = 'Demo direset.';
      window.location.href = 'admin-login.html';
    });

    if (isLoggedIn()) {
      window.location.href = 'admin-dashboard.html';
    }
  </script>
</body>
</html>
