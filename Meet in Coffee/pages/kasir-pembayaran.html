<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kasir Pembayaran | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Kasir • Pembayaran</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="kasir-pesanan.html">Pesanan</a>
        <a class="nav__link" href="kasir-pembayaran.html">Pembayaran</a>
        <a class="nav__link" href="kasir-struk.html">Struk</a>
        <a class="nav__link" href="admin-dashboard.html">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Konfirmasi Pembayaran (Mock)</h1>

    <div class="card">
      <div class="muted" style="font-size:13px" id="hint">—</div>
      <div class="divider"></div>

      <div class="grid-2" style="align-items:start">
        <div>
          <div id="meta" class="muted"></div>
          <div class="divider"></div>
          <h2 class="card__title" style="margin-top:0">Item</h2>
          <div id="details"></div>
        </div>
        <div>
          <div>
            <div class="muted" style="font-size:13px">Total</div>
            <div id="total" style="font-weight:900; font-size:28px">Rp 0</div>
          </div>

          <hr class="sep" />

          <label>Metode Pembayaran (demo)</label>
          <select id="payMethod" class="input">
            <option value="Tunai">Tunai</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer">Transfer</option>
          </select>

          <div class="row" style="margin-top:12px; gap:12px; flex-wrap:wrap">
            <button id="btnConfirm" class="btn btn--primary" type="button">Konfirmasi Sudah Dibayar</button>
            <button id="btnBack" class="btn" type="button">Kembali</button>
          </div>

          <div class="divider"></div>
          <div class="kv">
            <div>
              <div style="font-weight:800">Struk</div>
              <div class="muted">Setelah pembayaran dikonfirmasi, struk siap dicetak.</div>
            </div>
            <span class="badge">Mock</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const hint = document.getElementById('hint');
    const meta = document.getElementById('meta');
    const details = document.getElementById('details');
    const total = document.getElementById('total');

    const orderId = sessionStorage.getItem('mic_last_cashier_order_id');
    if (!orderId) {
      hint.textContent = 'Tidak ada pesanan terpilih. Kembali ke daftar pesanan.';
      document.getElementById('btnBack').addEventListener('click', ()=> window.location.href='kasir-pesanan.html');
    }

    const render = () => {
      if (!orderId) return;
      const order = MIC.getOrderById(orderId);
      if (!order) {
        hint.textContent = 'Pesanan tidak ditemukan.';
        return;
      }
      hint.textContent = `Pesanan dipilih: #${order.id_pesanan} • Meja ${order.nomor_meja}`;
      meta.innerHTML = `
        <div><b>ID Pesanan</b>: ${order.id_pesanan}</div>
        <div><b>Status</b>: ${order.status}</div>
        <div class="muted" style="margin-top:6px; font-size:13px">Tanggal: ${new Date(order.tanggal).toLocaleString('id-ID')}</div>
      `;
      total.textContent = MIC.fmtIDR(order.total);

      details.innerHTML = (order.details || []).map(d => `
        <div class="kv">
          <div>
            <div style="font-weight:900">${MIC.getMenuById(d.id_menu)?.nama_menu || 'Menu'}</div>
            <div class="muted" style="font-size:13px">Jumlah: ${d.jumlah}</div>
          </div>
          <div style="font-weight:900">${MIC.fmtIDR(d.subtotal)}</div>
        </div>
      `).join('');
    };

    document.getElementById('btnBack').addEventListener('click', () => {
      window.location.href = 'kasir-pesanan.html';
    });

    document.getElementById('btnConfirm').addEventListener('click', () => {
      if (!orderId) return;
      const order = MIC.getOrderById(orderId);
      if (!order) return;

      MIC.updateOrderStatus(orderId, 'Sudah dibayar');
      sessionStorage.setItem('mic_last_cashier_order_id', orderId);
      window.location.href = 'kasir-struk.html';
    });

    render();
  </script>
</body>
</html>
