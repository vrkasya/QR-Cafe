<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Kategori | Meet in Coffee</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__logo">☕</div>
        <div class="brand__name">
          <div class="brand__title">Meet in Coffee</div>
          <div class="brand__subtitle">Admin • Kategori</div>
        </div>
      </div>
      <nav class="nav">
        <a class="nav__link" href="admin-dashboard.html">Dashboard</a>
        <a class="nav__link" href="admin-menu.html">Menu</a>
        <a class="nav__link" href="admin-meja.html">Meja</a>
        <a class="nav__link" href="admin-pesanan.html">Pesanan</a>
        <a class="nav__link" href="admin-laporan.html">Laporan</a>
        <a class="nav__link" href="admin-login.html" id="btnLogout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Manajemen Kategori (Demo)</h1>

    <div class="card">
      <div class="grid-2">
        <div>
          <h2 class="card__title" style="margin-top:0">Tambah Kategori</h2>
          <label>Nama Kategori</label>
          <input id="nama" class="input" placeholder="Contoh: Kopi" />

          <div class="row" style="margin-top:12px; gap:12px; flex-wrap:wrap">
            <button id="btnAdd" class="btn btn--primary" type="button">Tambah</button>
            <button id="btnReset" class="btn" type="button">Reset Demo</button>
          </div>

          <div class="muted" style="margin-top:12px; font-size:13px">
            Hapus kategori akan menghapus kategori dari mock. Menu yang masih memakai id kategori akan tetap tersimpan.
          </div>
        </div>

        <div>
          <h2 class="card__title" style="margin-top:0">Daftar Kategori</h2>
          <div style="overflow:auto; max-height:420px">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nama</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/app.js"></script>
  <script>
    const isLoggedIn = () => localStorage.getItem('mic_admin_logged_in_v1') === '1';
    if (!isLoggedIn()) window.location.href = 'admin-login.html';

    document.getElementById('btnLogout').addEventListener('click', (e)=>{
      e.preventDefault();
      localStorage.setItem('mic_admin_logged_in_v1','0');
      window.location.href = 'admin-login.html';
    });

    const stateLoad = () => {
      const raw = localStorage.getItem('mic_demo_v1');
      return raw ? JSON.parse(raw) : null;
    };
    const stateSave = (s) => localStorage.setItem('mic_demo_v1', JSON.stringify(s));

    function render() {
      const st = stateLoad() || { categories: [] };
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = (st.categories || []).map(c => `
        <tr>
          <td>${c.id}</td>
          <td>${c.nama}</td>
          <td><button class="btn" type="button" data-del="${c.id}">Hapus</button></td>
        </tr>
      `).join('');

      tbody.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del');
          if (!confirm('Hapus kategori ini?')) return;
          const st2 = stateLoad() || { categories: [] };
          st2.categories = (st2.categories || []).filter(x => String(x.id) !== String(id));
          stateSave(st2);
          render();
        });
      });
    }

    document.getElementById('btnAdd').addEventListener('click', () => {
      const nama = document.getElementById('nama').value?.trim();
      if (!nama) return alert('Nama kategori wajib');

      const st = stateLoad() || { categories: [], menus: [], tables: [], orders: [], payments: [], now: 0, version: 1 };
      st.categories = st.categories || [];
      const nextId = (st.categories.reduce((mx,c)=>Math.max(mx, Number(c.id||0)),0) || 0) + 1;
      st.categories.push({ id: nextId, nama });
      stateSave(st);
      document.getElementById('nama').value = '';
      render();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      if (!confirm('Reset seluruh data demo?')) return;
      MIC.resetDemoData();
      render();
    });

    render();
  </script>
</body>
</html>
